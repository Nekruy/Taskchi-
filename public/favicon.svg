<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">

  <defs>
    <linearGradient id="tcf-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3ED47A"/>
      <stop offset="55%"  stop-color="#22B84F"/>
      <stop offset="100%" stop-color="#14A800"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="100" height="100" rx="24" fill="url(#tcf-tile)"/>

  <!-- Wide-spread network: nodes pushed out, thin spokes, small centre.
       At 16px this reads as a ring of dots around a hub instead of a blob. -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="50" y1="50" x2="50" y2="22"/>
    <line x1="50" y1="50" x2="74" y2="36"/>
    <line x1="50" y1="50" x2="74" y2="64"/>
    <line x1="50" y1="50" x2="50" y2="78"/>
    <line x1="50" y1="50" x2="26" y2="64"/>
    <line x1="50" y1="50" x2="26" y2="36"/>
  </g>

  <!-- Nodes -->
  <g fill="#ffffff">
    <circle cx="50" cy="22" r="8"/>
    <circle cx="74" cy="36" r="8"/>
    <circle cx="74" cy="64" r="8"/>
    <circle cx="50" cy="78" r="8"/>
    <circle cx="26" cy="64" r="8"/>
    <circle cx="26" cy="36" r="8"/>
  </g>

  <!-- Centre hub — deliberately smaller so the ring stays readable when tiny -->
  <circle cx="50" cy="50" r="9.5" fill="#ffffff"/>

</svg>
