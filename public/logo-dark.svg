  <!-- ── Wordmark: white + brand green, for dark backgrounds ── -->
  <text
    x="62" y="34"
    font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="25" font-weight="800" letter-spacing="-0.8"
    fill="#ffffff"
  >Task<tspan fill="#3ED47A">chi</tspan></text>

  <text
    x="63" y="47"
    font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
