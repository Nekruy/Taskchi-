<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 60" width="210" height="60" fill="none">

  <defs>
    <!-- Icon tile gradient: light green → brand green -->
    <linearGradient id="tc-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3ED47A"/>
      <stop offset="55%"  stop-color="#22B84F"/>
      <stop offset="100%" stop-color="#14A800"/>
    </linearGradient>
    <!-- Soft drop shadow under the tile -->
    <filter id="tc-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2" flood-color="#14A800" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ── Icon mark ── -->
  <g filter="url(#tc-shadow)">
    <rect x="5" y="6" width="48" height="48" rx="13" fill="url(#tc-tile)"/>
  </g>

  <!-- Network inside the tile (local coords 0–48, offset by x=5 y=6) -->
  <g transform="translate(5 6)">
    <!-- spokes + hexagon ring -->
    <g stroke="#ffffff" stroke-width="1.05" stroke-linecap="round" opacity="0.75">
      <line x1="24" y1="24" x2="24" y2="11.5"/>
      <line x1="24" y1="24" x2="34.8" y2="17.8"/>
      <line x1="24" y1="24" x2="34.8" y2="30.2"/>
      <line x1="24" y1="24" x2="24" y2="36.5"/>
      <line x1="24" y1="24" x2="13.2" y2="30.2"/>
      <line x1="24" y1="24" x2="13.2" y2="17.8"/>
      <line x1="24" y1="11.5" x2="34.8" y2="17.8"/>
      <line x1="34.8" y1="17.8" x2="34.8" y2="30.2"/>
      <line x1="34.8" y1="30.2" x2="24" y2="36.5"/>
      <line x1="24" y1="36.5" x2="13.2" y2="30.2"/>
      <line x1="13.2" y1="30.2" x2="13.2" y2="17.8"/>
      <line x1="13.2" y1="17.8" x2="24" y2="11.5"/>
    </g>
    <!-- outer nodes -->
    <g fill="#ffffff">
      <circle cx="24"   cy="11.5" r="2.5"/>
      <circle cx="34.8" cy="17.8" r="2.5"/>
      <circle cx="34.8" cy="30.2" r="2.5"/>
      <circle cx="24"   cy="36.5" r="2.5"/>
      <circle cx="13.2" cy="30.2" r="2.5"/>
      <circle cx="13.2" cy="17.8" r="2.5"/>
    </g>
    <!-- centre node -->
    <circle cx="24" cy="24" r="4.2" fill="#ffffff"/>
  </g>

  <!-- ── Wordmark: "Task" dark + "chi" brand green ── -->
  <text
    x="62" y="34"
    font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="25" font-weight="800" letter-spacing="-0.8"
    fill="#111827"
  >Task<tspan fill="#22B84F">chi</tspan></text>

  <!-- ── Subtitle ── -->
  <text
    x="63" y="47"
    font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="7" font-weight="600" letter-spacing="2.2"
    fill="#9ca3af"
  >МАРКЕТПЛЕЙС УСЛУГ</text>

</svg>
