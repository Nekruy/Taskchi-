<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">

  <defs>
    <linearGradient id="tci-tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3ED47A"/>
      <stop offset="55%"  stop-color="#22B84F"/>
      <stop offset="100%" stop-color="#14A800"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="100" height="100" rx="27" fill="url(#tci-tile)"/>

  <!-- Network: hexagon ring + spokes -->
  <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
    <line x1="50" y1="50" x2="50" y2="24"/>
    <line x1="50" y1="50" x2="72.5" y2="37"/>
    <line x1="50" y1="50" x2="72.5" y2="63"/>
    <line x1="50" y1="50" x2="50" y2="76"/>
    <line x1="50" y1="50" x2="27.5" y2="63"/>
    <line x1="50" y1="50" x2="27.5" y2="37"/>
    <line x1="50"   y1="24" x2="72.5" y2="37"/>
    <line x1="72.5" y1="37" x2="72.5" y2="63"/>
    <line x1="72.5" y1="63" x2="50"   y2="76"/>
    <line x1="50"   y1="76" x2="27.5" y2="63"/>
    <line x1="27.5" y1="63" x2="27.5" y2="37"/>
    <line x1="27.5" y1="37" x2="50"   y2="24"/>
  </g>

  <!-- Outer nodes -->
  <g fill="#ffffff">
    <circle cx="50"   cy="24" r="5.2"/>
    <circle cx="72.5" cy="37" r="5.2"/>
    <circle cx="72.5" cy="63" r="5.2"/>
    <circle cx="50"   cy="76" r="5.2"/>
    <circle cx="27.5" cy="63" r="5.2"/>
    <circle cx="27.5" cy="37" r="5.2"/>
  </g>

  <!-- Centre node -->
  <circle cx="50" cy="50" r="8.8" fill="#ffffff"/>

</svg>
